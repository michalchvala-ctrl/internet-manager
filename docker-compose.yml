services:
  internet-manager:
    build: .
    container_name: internet-manager
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8000"
    env_file:
      - .env
    volumes:
      - im-data:/data
    # Uncomment if MikroTik/AdGuard are only reachable on host LAN:
    # network_mode: host
    # (on Linux; on Docker Desktop use host.docker.internal IPs instead)

volumes:
  im-data:
